<hy-drawer
  id="_drawer"
  class="{% if include.cover %}cover{% endif %}"
  side="left"
  threshold="10"
  noscroll
  {% if include.cover %}opened{% endif %}
>
  <header id="_sidebar" class="sidebar" role="banner">
    {% include_cached body/sidebar-bg.html image=include.image color=include.color theme_color=include.theme_color %}
    {% include_cached body/sidebar-sticky.html %}
  </header>
</hy-drawer>
<button id="_sidebar-panel-toggle" class="sidebar-panel-toggle" type="button"
        aria-controls="_drawer" aria-expanded="true" aria-label="사이드바 접기"
        title="사이드바 접기" hidden>
  <span aria-hidden="true">‹</span>
</button>
<hr class="sr-only" hidden />
